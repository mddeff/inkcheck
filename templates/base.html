<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}InkCheck{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="no-print">
    <a class="brand" href="{{ url_for('register') }}">
      <img class="logo logo-light" src="{{ url_for('static', filename='logo-light.png') }}" alt="">
      <img class="logo logo-dark" src="{{ url_for('static', filename='logo-dark.png') }}" alt="">
      <h1>InkCheck</h1>
    </a>
    {% if balance_cents is defined %}
    <div class="balance">Balance: ${{ balance_cents | money }}</div>
    {% endif %}
  </header>

  <nav class="tabs no-print">
    <a class="{{ 'active' if request.endpoint == 'register' else '' }}" href="{{ url_for('register') }}">Register</a>
    <a class="{{ 'active' if request.endpoint == 'new_check' else '' }}" href="{{ url_for('new_check') }}">Write a check</a>
    <a class="{{ 'active' if request.endpoint == 'new_deposit' else '' }}" href="{{ url_for('new_deposit') }}">Add a deposit</a>
  </nav>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for m in messages %}
        <div class="flash no-print">{{ m }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}

  <div id="modal-overlay" class="modal-overlay no-print" hidden>
    <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="modal-message">
      <p id="modal-message"></p>
      <div class="modal-actions">
        <button type="button" class="secondary" id="modal-cancel">Cancel</button>
        <button type="button" id="modal-ok">Continue</button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
