services:
  inkcheck:
    image: ghcr.io/mddeff/inkcheck:${INKCHECK_VERSION:-latest}
#    build: .          # dev fallback: build from source instead of pulling
    container_name: inkcheck
    volumes:
      - ./data:/data
      - ./config:/app/config
    environment:
      - TZ=America/New_York
      - DATABASE_PATH=/data/inkcheck.db
    networks:
      - proxy
    restart: unless-stopped
#    ports:
#      - "8000:8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.inkcheck.rule=Host(`${INKCHECK_HOST:-inkcheck.example.lan}`)"
      - "traefik.http.routers.inkcheck.entrypoints=web,websecure"
      - "traefik.http.services.inkcheck.loadbalancer.server.port=8000"

networks:
  proxy:
    external: true
